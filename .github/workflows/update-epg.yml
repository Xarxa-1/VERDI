name: Actualitzador EPG 3Cat Verdi Clàssics

on:
  schedule:
    # Execució automàtica cada 5 minuts (límit màxim permès per GitHub)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Entorn Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar Dependències
        run: pip install -r requirements.txt

      - name: Executar Scraper i Generar XML
        run: python scraper.py

      - name: Persistir Canvis a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml
          git diff-index --quiet HEAD || git commit -m "Auto-update EPG [skip ci]"
          git push
