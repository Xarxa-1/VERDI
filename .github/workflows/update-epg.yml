name: Actualitzador EPG Multicanal STARZ

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar Dependències
        run: pip install -r requirements.txt

      - name: Executar Scraper Multicanal
        run: python scraper.py

      - name: Forçar guardat a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Auto-update STARZ MultiChannel EPG [skip ci]" || echo "Sense canvis per fer commit"
          git push origin HEAD:${{ github.ref }}
