name: Actualitza EPG de 3Cat

on:
  schedule:
    # Cada 5 minuts (mínim permès per GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch:   # Permet execució manual

permissions:
  contents: write      # Necessari per fer commit

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Genera l'EPG
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, sys
          from datetime import datetime, timezone
          from xml.etree.ElementTree import Element, SubElement, tostring
          from xml.dom import minidom

          API_URL = "https://api-media.3cat.cat/pvideo/media.jsp?media=video&versio=vast&idint=tem1&desplacament=0&profile=pc_3cat"
          OUTPUT = "epg.xml"

          try:
              req = urllib.request.Request(API_URL, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode('utf-8'))
          except Exception as e:
              print(f"Error descarregant l'API: {e}")
              sys.exit(1)

          # Timestamp d'execució -> fa que el fitxer sempre sigui diferent
          generated_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          tv = Element("tv", attrib={
              "generator-info-name": "3cat-epg",
              "generated": generated_at
          })

          ch = SubElement(tv, "channel", id="tem1")
          SubElement(ch, "display-name", lang="ca").text = "TEM1"

          def add_prog(prog):
              start = prog.get("data_emissio", {}).get("utc")
              stop = prog.get("data_caducitat", {}).get("utc")
              if not start or not stop:
                  return
              st_dt = datetime.fromisoformat(start).strftime("%Y%m%d%H%M%S %z")
              sp_dt = datetime.fromisoformat(stop).strftime("%Y%m%d%H%M%S %z")
              p = SubElement(tv, "programme", start=st_dt, stop=sp_dt, channel="tem1")
              SubElement(p, "title", lang="ca").text = prog.get("titol", "Sense títol")
              SubElement(p, "desc", lang="ca").text = prog.get("descripcio", "")
              if prog.get("programa"):
                  SubElement(p, "category", lang="ca").text = prog["programa"]

          info = data.get("informacio", {})
          if info.get("arafem"):
              add_prog(info["arafem"])
          if info.get("despresfem"):
              add_prog(info["despresfem"])

          xml_str = minidom.parseString(tostring(tv)).toprettyxml(indent="  ", encoding="UTF-8").decode("UTF-8")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write(xml_str)

          print(f"EPG generat correctament a {generated_at}")
          PYEOF

      - name: Commit i push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --staged --quiet || git commit -m "Actualitza EPG $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
