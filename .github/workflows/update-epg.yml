name: Actualitzador EPG 3Cat

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Scraper
        run: python scraper.py

      - name: Publicar canvis a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml
          git commit -m "Auto-update EPG 3Cat [skip ci]" || echo "Sense canvis en la graella"
          git push
