name: Actualitza EPG 3Cat

on:
  schedule:
    - cron: '*/1 * * * *' # Cada 5 minuts (mínim de GitHub)
  workflow_dispatch:      # Permet executar-ho manualment

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instal·lar dependències
        run: pip install -r requirements.txt

      - name: Executar l'scraper
        run: python scraper.py

      - name: Commit i Push (SEMPRE)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          # El --allow-empty garanteix que sempre es faci commit,
          # fins i tot si (per casualitat) el fitxer no hagués canviat.
          git commit --allow-empty -m "Actualitza EPG $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
