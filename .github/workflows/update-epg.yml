name: Actualitzador EPG 3Cat

on:
  schedule:
    - cron: '15 * * * *'  # S'executa cada hora al minut 15
  workflow_dispatch:      # Permet executar-ho manualment

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Scraper 3Cat
        run: python scraper.py

      - name: Desar canvis a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add epg.xml
          git commit -m "Auto-update 3Cat EPG [skip ci]" || echo "No hi ha canvis per commitejar"
          git push
